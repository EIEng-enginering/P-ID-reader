[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "pid-reader-engineering"
version = "0.11.0-dev0"
description = "Evidence-first P&ID reader development foundation"
requires-python = ">=3.12"
dependencies = ["pdfplumber>=0.11,<0.13", "pypdf>=5,<7"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4,<5", "reportlab>=4,<5"]
gui = ["PySide6==6.12.0", "pypdfium2>=4,<6"]
dxf = ["ezdxf>=1.4,<2"]
ocr = ["pypdfium2>=4,<6", "pytesseract>=0.3,<1", "Pillow>=11,<13"]
[project.scripts]
pid-reader = "pid_reader.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
